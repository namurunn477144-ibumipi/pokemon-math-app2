<html lang="ja">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    /* ベース：けいさんモード（明るいスカイブルー） */
    :root {
      --primary: #03A9F4; --primary-shadow: #0288D1;
      --secondary: #FFB300; --secondary-shadow: #FF8F00;
      --bg-color: #E1F5FE; --card-bg: #FFFFFF;
      --text-main: #0277BD; --correct: #4CAF50; --incorrect: #F44336;
      --bg-dot: #B3E5FC;
    }
    
    /* せいかつモード（ディープネイビー） */
    body.mode-life {
      --primary: #1A237E; --primary-shadow: #0D47A1;
      --secondary: #FFC107; --secondary-shadow: #FFA000;
      --bg-color: #E8EAF6; --card-bg: #FFFFFF;
      --text-main: #1A237E;
      --bg-dot: #C5CAE9;
    }

    * { box-sizing: border-box; font-family: 'M PLUS Rounded 1c', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background-color: var(--bg-color); background-image: radial-gradient(var(--bg-dot) 2px, transparent 2px); background-size: 20px 20px; color: var(--text-main); overflow-x: hidden; touch-action: manipulation; transition: background-color 0.5s; }
    
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
    .view { display: flex; flex-direction: column; align-items: center; padding: 15px; min-height: 100vh; transition: opacity 0.3s ease; }
    .view.hidden { display: none !important; opacity: 0; }
    
    .app-header { text-align: center; margin-bottom: 10px; }
    #main-title { font-size: 2rem; color: var(--primary-shadow); line-height: 1.2; text-shadow: 2px 2px 0px #FFF; margin: 10px 0; transition: color 0.5s; }
    
    /* ステージ背景 */
    .partner-stage { position: relative; width: 100%; border-radius: 24px; padding: 30px 20px 15px; border: 4px solid #FFF; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; margin-bottom: 10px; cursor: pointer; overflow: hidden; transition: background 0.5s; }
    
    .partner-stage.bg-grass { background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%); }
    .partner-stage.bg-grass::before { content: '🌱☘️🍀'; position: absolute; bottom: 5px; left: 10px; font-size: 1.2rem; opacity: 0.6; }
    .partner-stage.bg-grass::after { content: '🍀☘️🌱'; position: absolute; bottom: 5px; right: 10px; font-size: 1.2rem; opacity: 0.6; }

    .partner-stage.bg-lovely { background: linear-gradient(180deg, #FFF0F5 0%, #FFD1DC 100%); }
    .partner-stage.bg-lovely::before { content: '💖✨'; position: absolute; bottom: 8px; left: 12px; font-size: 1.2rem; opacity: 0.7; }
    .partner-stage.bg-lovely::after { content: '✨💖'; position: absolute; bottom: 8px; right: 12px; font-size: 1.2rem; opacity: 0.7; }

    .partner-stage.bg-cool { background: linear-gradient(180deg, #2A0845 0%, #6441A5 100%); border-color: #FFD700; }
    .partner-stage.bg-cool::before { content: '⚡⭐'; position: absolute; bottom: 8px; left: 12px; font-size: 1.2rem; opacity: 0.8; }
    .partner-stage.bg-cool::after { content: '⭐⚡'; position: absolute; bottom: 8px; right: 12px; font-size: 1.2rem; opacity: 0.8; }
    .partner-stage.bg-cool #partner-name-room { color: #FFD700; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

    .partner-image { width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0 8px 6px rgba(0,0,0,0.2)); animation: float 3s ease-in-out infinite; transition: transform 0.3s; z-index: 5; position: relative; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .partner-name { font-size: 1.5rem; color: var(--text-main); margin: 5px 0 0 0; pointer-events: none; font-weight: 900; }
    
    .poke-comment { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #FFF; border: 3px solid var(--primary); border-radius: 20px; padding: 6px 14px; font-size: 1rem; font-weight: 900; color: var(--text-main); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20; white-space: nowrap; box-shadow: 0 4px 6px rgba(0,0,0,0.15); }
    .poke-comment::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: var(--primary) transparent transparent transparent; }
    
    @keyframes jumpPoke { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px); } }
    .anim-jump { animation: jumpPoke 0.4s ease !important; }
    @keyframes spinPoke { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
